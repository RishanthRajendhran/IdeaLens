extends: _base.yaml
name: OpAI-Bench
number: 11
group: Idea provenance
asks: >
  Nine successive AI rewrites of one human draft. The ideas never change.
metric: fire
positive: human
upstream: >
  OpAI-Bench: 4,754 documents x nine versions (v0..v8), each a further AI edit of
  one human seed, with published target AI proportions from 0.00% to 99.35%.
data_dir: test11_opai_bench
legacy_item_stem: opaifull   # directory suffix of the sharded per-item
                        # predictions; read by scripts/data/import_results.py
deleak_status: done

report:
  rung_caption: "every row is human-conceived; each rung is one more AI rewrite"
  metric: fire
  group_by: [level]
  in_set: false      # every row is human-conceived; there are no negatives to
                     # calibrate on inside the set

notes: >
  UNDER THE IDEA-LEVEL LABELLING RULE EVERY ROW IS HUMAN, so every fire is a
  false positive and this eval is an FPR curve, not an accuracy test.

  The AI contribution across those stages is polish, paraphrase, style rewrite,
  compress and expand -- all SURFACE operations on a human document. Our
  predicted result therefore disagrees with the benchmark's own target
  proportions by design, and that disagreement is the point. PREREGISTER the
  prediction before looking at the numbers: reporting a low number afterwards as
  a quiet weakness makes it a worse paper; explaining the label-philosophy
  difference makes it the paper that motivates the method.
