extends: _base.yaml
name: "Can LLMs Produce Novel Research Ideas? — ideation study"
number: 26
group: Idea provenance
asks: >
  Expert-written research proposals and model-written ones, every one copy-edited
  by an LLM into the study's template (wording and formatting only, content
  preserved; Si et al., Appendix D). With template and editor shared, does the
  verdict track whose idea it was?
metric: fire
positive: mixed
upstream: >
  Si, Yang & Hashimoto, "Can LLMs Produce Novel Research Ideas? A Large-Scale
  Human Study with 100+ NLP Researchers" (Stanford). The ideation half: 147
  research proposals across three conditions — expert ideas, model ideas, and
  model ideas after the authors' own reranking.
data_dir: test26_research_ideas_ideation
legacy_item_stem: airesearch1   # directory suffix of the sharded per-item
                        # predictions; read by scripts/data/import_results.py
deleak_status: not_run   # STAGE 2 HAS NOT BEEN RUN ON THIS SET. Scores come
                         # from UNTREATED outlines: an upper bound that partly
                         # measures wording lifted from the source, and not
                         # comparable with the de-leaked sets until it runs.
                         # Fix with: scripts/pipeline/run_pipeline.py --stage 2

arms:
  - {id: expert_idea, source: human, detail: "written by a recruited NLP researcher"}
  - {id: model_idea, source: ai, detail: "generated by their ideation agent"}
  - {id: model_idea_reranked, source: ai, detail: "the same agent's ideas after their reranker"}

report:
  rung_caption: "every proposal was copy-edited by an LLM into the study's template (wording and formatting only); only the ideas differ"
  metric: fire
  group_by: [arm]
  # Both idea conditions are present, so a TPR/FPR pair is defined; the fire rate
  # per arm is reported alongside because the arms are the experimental variable.
  in_set: false
  baselines: [pangram_4]

notes: >
  THE HUMAN-IDEAS / MODEL-PROSE CELL IN A REAL STUDY. Experts and the ideation
  agent wrote to the same template, and the authors then passed EVERY proposal
  through an LLM style-normalisation step so that writing style could not sway
  their human reviewers (Si, Yang & Hashimoto, Section 2; prompt in Appendix D).
  The prompt limits the edit to wording and formatting: punctuation,
  capitalisation, line breaks, bullets, template vocabulary in place of informal
  phrasing, and minor rephrasing, with no change of content ("No other changes
  are allowed beyond these"; "For the proposed method section, avoid any big
  changes"). The first author checked every human proposal for preserved content.
  So the expert-idea arm is a person's ideas in model-polished prose: human ideas,
  model prose, by construction (label confirmed 2026-09-15).

  The polish is light. Pangram 4 reads the expert proposals as mostly human
  (fraction human 0.78, 12.5% flagged at its 0.5 rule) and the model proposals as
  AI (100%), so a surface detector still sees the expert's own wording. The labels
  come from the study design, not from any detector's reading.

  Read the GAP between arms, not the level. Absolute rates on academic proposals
  written to a template are not the point; whether the detector separates expert
  ideas from model ideas when the prose is held constant is.
