[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideadet"
version = "0.1.0"
description = "Idea-level authorship detection: attribute a document to whoever conceived it, not whoever wrote its sentences."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3",
    "pandas>=2.0", "pyarrow>=14.0", "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = ["google-genai>=1.0", "google-cloud-storage>=2.14", "google-auth>=2.28",
             "requests>=2.31", "openai>=1.40", "tinker", "pangram-sdk"]
local = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.30",
         "datasets>=2.20", "huggingface-hub>=0.24"]
audits = ["spacy>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

# Scripts also run straight from a clone with no install: each one does
# `import _bootstrap`, which puts src/ on the path. Installing is optional.
